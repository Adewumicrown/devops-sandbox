server {
    listen 21000;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream sandbox-app-env-430c5255;
        proxy_pass http://$upstream:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Env-ID env-430c5255;
    }
}
